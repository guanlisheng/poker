{% if jekyll.environment == "production" and site.google_analytics %}
  {% assign ga_id = site.google_analytics | strip %}
  {% if ga_id != "" %}
    <!-- Google tag (gtag.js) -->
    <script async
      src="https://www.googletagmanager.com/gtag/js?id={{ ga_id | escape }}">
    </script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        window.dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', '{{ ga_id | escape }}');
    </script>
  {% endif %}
{% endif %}
