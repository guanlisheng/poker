<header class="site-header">
  <div class="wrapper header-inner">
    <a class="site-brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark" aria-hidden="true">西</span>
      <span>{{ site.title | escape }}</span>
    </a>

    <nav class="site-nav" aria-label="主导航">
      <a href="{{ '/' | relative_url }}"
         {% if page.url == '/' %}aria-current="page"{% endif %}>
        首页
      </a>

      <a href="{{ '/01-clock/' | relative_url }}"
         {% if page.url contains '01-clock' %}aria-current="page"{% endif %}>
        产品功能
      </a>

      <a href="{{ '/03-terminal/' | relative_url }}"
         {% if page.url contains '03-terminal' %}aria-current="page"{% endif %}>
        大屏方案
      </a>

      <a href="{{ '/blog/' | relative_url }}"
         {% if page.url contains '/blog/' %}aria-current="page"{% endif %}>
        动态
      </a>

      <a class="nav-cta"
         href="https://poker.nkucyd.cn/">
        开始使用
      </a>
    </nav>
  </div>
</header>
