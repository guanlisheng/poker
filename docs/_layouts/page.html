---
layout: default
---

<article class="page-article">
  <header class="page-header">
    <h1>{{ page.title | escape }}</h1>

    {% if page.description %}
      <p class="page-description">
        {{ page.description | escape }}
      </p>
    {% endif %}
  </header>

  {% include auto_nav.html position="top" %}

  <div class="prose">
    {{ content }}
  </div>

  {% include auto_nav.html position="bottom" %}
</article>
